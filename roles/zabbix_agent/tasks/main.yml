---
- name: Pievieno Zabbix repository (prieks Debian/Ubuntu)
  ansible.builtin.apt:
    deb: "https://repo.zabbix.com/zabbix/7.2/stable/ubuntu/pool/main/z/zabbix/zabbix-agent2_7.2.7-1+ubuntu24.04_arm64.deb"
    state: present
  when: ansible_os_family == "Debian"

- name: PIevieno Zabbix repository (prieks RedHat/CentOS)
  ansible.builtin.yum:
    name: "https://repo.zabbix.com/zabbix/7.2/stable/rhel/9/x86_64/zabbix-agent2-7.2.7-release1.el9.x86_64.rpm"
    state: present
  when: ansible_os_family == "RedHat"

- name: Uzstada Zabbix agent2
  ansible.builtin.package:
    name: zabbix-agent2
    state: present

- name: Kope Zabbix agent2 config failu
  ansible.builtin.template:
    src: zabbix_agent2.conf.j2
    dest: /etc/zabbix/zabbix_agent2.conf
    owner: root
    group: root
    mode: '0644'

- name: Startē un iespējo Zabbix agent2 servisu
  ansible.builtin.service:
    name: zabbix-agent2
    enabled: yes
    state: started
