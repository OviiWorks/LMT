---
- name: Parbauda vai 'sudo' grupa eksiste (Debian-based sistemas)
  ansible.builtin.group:
    name: sudo
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: Parbauda vai 'wheel' grupa eksiste (RHEL-based sistemas)
  ansible.builtin.group:
    name: wheel
    state: present
  when: ansible_facts['os_family'] == "RedHat"

- name: Pievieno lietotaju "{{ new_user }}"
  ansible.builtin.user:
    name: "{{ new_user }}"
    comment: "{{ new_user_comment }}"
    groups: "{{ admin_group }}"
    shell: /bin/bash
    create_home: yes
    append: yes

- name: Pievieno ssh publikso atslegu ja ir defineta
  ansible.builtin.authorized_key:
    user: "{{ new_user }}"
    key: "{{ new_user_ssh_pubkey }}"
  when: new_user_ssh_pubkey is defined
